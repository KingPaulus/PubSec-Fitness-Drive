<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - System Error | PubSec Fitness Drive</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            padding: 24px;
            gap: 20px;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.6);
            line-height: 1;
            letter-spacing: 2px;
        }

        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .error-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-message {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .btn-home {
            background: linear-gradient(135deg, #0284c7, var(--primary));
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3);
            text-decoration: none;
            display: inline-block;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-home:active {
            transform: scale(0.97);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.6);
        }
    </style>
</head>
<body>
<div class="app-viewport">
    <header>
        <div class="badge">PUBSEC SECURE SYSTEM</div>
        <h1>SYSTEM FEHLER</h1>
    </header>

    <div class="content">
        <div class="error-container">
            <div class="error-code">404</div>

            <div class="error-card">
                <div class="error-title">Sektor nicht gefunden</div>
                <p class="error-message">
                    Die angeforderte Route oder Datei existiert nicht im PubSec-Netzwerk.
                    Bitte kehre zur Zentrale zurück.
                </p>
                <a href="index.html" class="btn-home">ZURÜCK ZUM HAUPTMENÜ</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
